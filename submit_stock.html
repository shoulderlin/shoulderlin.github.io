<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ 快篩供應商庫存更新系統</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

    :root {
      --bg-main: #060913;
      --bg-card: rgba(13, 20, 38, 0.75);
      --border-light: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: linear-gradient(135deg, #3b82f6, #8b5cf6);
      --accent-solid: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 20px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-light);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header i {
      font-size: 40px;
      background: var(--accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px 12px 38px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      color: var(--text-main);
      outline: none;
      font-size: 14px;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--accent-solid);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* 定位區塊 */
    .gps-row {
      display: flex;
      gap: 12px;
    }

    .gps-row input {
      padding-left: 14px;
    }

    .gps-btn {
      padding: 12px 16px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .gps-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    .status-msg {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      display: none;
    }

    .status-msg.success { color: #10b981; }
    .status-msg.error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="header">
      <i class="fa-solid fa-truck-medical"></i>
      <h2>庫存與定位更新系統</h2>
      <p>填寫表單將自動儲存並於幾分鐘內呈現在快篩地圖網頁中</p>
    </div>

    <form id="stockForm">
      <div class="form-group">
        <label>藥局/供應商名稱 *</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-store"></i>
          <input type="text" id="name" placeholder="例如：信義特約大藥局" required>
        </div>
      </div>

      <div class="form-group">
        <label>聯絡電話 *</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" id="phone" placeholder="例如：02-27208889" required>
        </div>
      </div>

      <div class="form-group">
        <label>地址 *</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-map-location-dot"></i>
          <input type="text" id="address" placeholder="例如：台北市信義路五段7號" required>
        </div>
      </div>

      <!-- GPS 一鍵定位區塊 -->
      <div class="form-group">
        <label>地理坐標定位 *</label>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button type="button" class="gps-btn" id="gpsBtn">
            <i class="fa-solid fa-location-crosshairs"></i> 📍 點我自動載入店面定位
          </button>
          <div class="gps-row">
            <input type="text" id="lat" placeholder="緯度 (自動載入)" readonly required style="background: rgba(255,255,255,0.02); color: var(--text-muted);">
            <input type="text" id="lng" placeholder="經度 (自動載入)" readonly required style="background: rgba(255,255,255,0.02); color: var(--text-muted);">
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 12px;">
        <div class="form-group" style="flex: 1;">
          <label>COVID-19 快篩數量 *</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield-virus"></i>
            <input type="number" id="covidStock" min="0" value="0" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>營業時間</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-clock"></i>
          <input type="text" id="hours" placeholder="例如：09:00 - 22:00">
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">送出更新資料</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>

  <script>
    // ⚠️ 請在此貼入您在第一部分第 7 步取得的 Google Apps Script 網頁應用程式 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx17VDSqWjhHowhU6tQ8KDklRarbY7sDDGS3YU-WN39sxcc8WU5weJujpGiZsmgkz4j/exec";

    // 1. 定位獲取功能
    document.getElementById('gpsBtn').addEventListener('click', () => {
      const gpsBtn = document.getElementById('gpsBtn');
      const originText = gpsBtn.innerHTML;
      gpsBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 定位中...';
      gpsBtn.disabled = true;

      if (!navigator.geolocation) {
        alert("您的手機或瀏覽器不支援 GPS 定位");
        gpsBtn.innerHTML = originText;
        gpsBtn.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          document.getElementById('lat').value = position.coords.latitude.toFixed(6);
          document.getElementById('lng').value = position.coords.longitude.toFixed(6);
          gpsBtn.innerHTML = '<i class="fa-solid fa-check"></i> 定位成功';
          gpsBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)'; // 變綠色
          gpsBtn.disabled = false;
        },
        (error) => {
          console.error("定位失敗：", error);
          alert("定位失敗，請確保您已開啟 GPS 手機定位服務，並允許網頁讀取位置。");
          gpsBtn.innerHTML = originText;
          gpsBtn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    });

    // 2. 表單送出功能
    document.getElementById('stockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      
      submitBtn.innerText = "資料送出中...";
      submitBtn.disabled = true;
      statusMsg.style.display = 'none';

      // 檢查是否已取得定位
      const lat = document.getElementById('lat').value;
      const lng = document.getElementById('lng').value;
      if (!lat || !lng) {
        alert("請先點擊「自動載入店面定位」以獲取經緯度！");
        submitBtn.innerText = "送出更新資料";
        submitBtn.disabled = false;
        return;
      }

      const payload = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        lat: lat,
        lng: lng,
        covidStock: parseInt(document.getElementById('covidStock').value) || 0,
        hours: document.getElementById('hours').value || "09:00 - 21:00"
      };



      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors', // 💡 改為 no-cors 模式，解決 Google 重新導向時的 CORS 阻擋問題
          headers: {
            'Content-Type': 'text/plain'
          },
          body: JSON.stringify(payload)
        });

        // 在 no-cors 模式下，我們無法且不需要讀取 response.json() 的回傳內容，
        // 只要 fetch Promise 沒有拋出錯誤，即代表資料已經順利送出並被 GAS 接收。
        statusMsg.innerText = "🎉 更新成功！資料已寫入資料庫！";
        statusMsg.className = "status-msg success";
        statusMsg.style.display = "block";
        document.getElementById('stockForm').reset();
        document.getElementById('gpsBtn').style.background = 'var(--accent)';
        document.getElementById('gpsBtn').innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> 📍 點我自動載入店面定位';
      } catch (err) {
        console.error("提交錯誤:", err);
        statusMsg.innerText = "❌ 提交失敗，請檢查您的網路連線或 GAS 網址是否正確。";
        statusMsg.className = "status-msg error";
        statusMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
