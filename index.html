<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>辦公小工具首頁</title>
  <meta name="description" content="集合多款實用辦公小工具，如文字比對、跨PDF搜尋、QR Code 產生器等，提升工作效率。">
  <meta name="keywords" content="辦公工具, PDF搜尋, QR Code, 密碼產生器, 倒數計時器">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --primary-color: #007BFF;
      --nav-bg: #f1f1f1;
      --hover-bg: #ddd;
      --active-bg: #007BFF;
      --active-text: #ffffff;
      --border-color: #ccc;
    }

    body.dark {
      --bg-color: #1e1e1e;
      --text-color: #f1f1f1;
      --primary-color: #3399ff;
      --nav-bg: #2c2c2c;
      --hover-bg: #444;
      --active-bg: #3399ff;
      --active-text: #ffffff;
      --border-color: #444;
    }

    /* 電腦版預設：鎖定高度，不出現外層雙滾動條 */
    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; 
      display: flex;
      flex-direction: column;
      height: 100vh; 
    }

    header, nav {
      flex-shrink: 0;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav {
      background-color: var(--nav-bg);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
    }

    nav li {
      margin: 0.25rem;
    }

    nav a {
      display: inline-block;
      padding: 0.5rem 1rem;
      text-decoration: none;
      color: var(--text-color);
      border-radius: 4px;
      transition: background 0.3s, color 0.3s;
    }

    nav a:hover {
      background-color: var(--hover-bg);
    }

    nav a.active {
      background-color: var(--active-bg);
      color: var(--active-text);
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-buttons button {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .nav-buttons button:hover {
      background-color: var(--hover-bg);
    }

    #themeToggle {
      font-size: 1rem;
    }

    #toolFrame {
      width: 100%;
      border: none;
      display: block;
      flex: 1; 
      min-height: 0;
    }

    .bottom-container {
      width: 100%;
      background-color: var(--nav-bg);
      border-top: 1px solid var(--border-color);
      text-align: center;
      flex-shrink: 0;
    }
    
    #div-onead-nd-01 {
      margin: 10px auto;
      max-width: 100%;
      max-height: 10%;
      display: flex !important;
      text-decoration: none;
      height: 60px;
      width: 60px;
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      padding: 1rem;
      background-color: var(--nav-bg);
    }

    #toggleButton {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1001;
      padding: 0.5rem 0.8rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .hidden {
      display: none !important;
    }

    /* 📱 關鍵優化：手機與平板行動裝置專用 RWD 樣式 */
    @media (max-width: 768px) {
      body {
        overflow-y: auto; /* 手機版允許整頁上下滾動，解決按鈕與廣告被瀏覽器 UI 遮擋的問題 */
        height: auto;     /* 移除鎖死螢幕高度 */
        display: block;   /* 取消電腦版的 flex 佈局限制 */
      }

      header {
        padding: 0.8rem;
        font-size: 1.2rem;
      }

      nav {
        flex-direction: column;
        align-items: stretch;
        padding: 0.5rem;
      }

      nav ul {
        flex-direction: column;
        width: 100%;
        margin-bottom: 0.5rem;
      }

      nav li {
        width: 100%;
        margin: 0.15rem 0;
      }

      nav a {
        display: block;
        text-align: center;
        padding: 0.6rem; /* 稍微放大點擊區域，方便手指操作 */
      }

      .nav-buttons {
        justify-content: space-between;
        margin-top: 0.25rem;
      }

      #toolFrame {
        height: 75vh !important; /* 手機上固定給予工具視窗 75% 螢幕高度，確保工具好操作 */
        min-height: 550px;       /* 避免工具被壓太扁 */
      }
    }
  </style>

  <script src="https://onead.onevision.com.tw/v2/adsrv?version=20250516&amp;uid=2000485&amp;category=-1&amp;cookie=true&amp;ip=&amp;guid=fb0cffa9919712d91c4119cc4dcf1f06&amp;channel=0&amp;volume=0.5&amp;r=&amp;adid=&amp;response_freq_multiple=native-drive.0&amp;web_location=https%3A%2F%2Fshoulderlin.github.io%2F&amp;title=%E8%BE%A6%E5%85%AC%E5%B0%8F%E5%B7%A5%E5%85%B7%E9%A6%96%E9%A0%81&amp;fp=fb0cffa9919712d91c4119cc4dcf1f06&amp;_t=1784106722141&amp;cb=ONEAD_text_response_3opye&amp;pb=0&amp;spid=&amp;player_type=NATIVE_LIST&amp;player_type=DPA_4_GRID_ND_300x250&amp;bgid=0" async></script>
</head>
<body>

  <header id="pageHeader">辦公小工具首頁</header>

  <nav id="navBar">
    <ul id="toolMenu">
      <li><a href="#" class="active" onclick="loadTool('./diffv4.html', this); return false;">文字比對</a></li>
      <li><a href="#" onclick="loadTool('./PDFSearcher.html', this); return false;">PDF 搜尋</a></li>
      <li><a href="#" onclick="loadTool('./QRCodeGenerator.html', this); return false;">QR Code</a></li>
      <li><a href="#" onclick="loadTool('./dailycalendar.html', this); return false;">日曆</a></li>

      <li><a href="#" onclick="loadTool('./dice2.html', this); return false;">抽籤</a></li>
    </ul>
    <div class="nav-buttons">
      <button onclick="window.frames['toolFrame'].print();">🖨️ 列印</button>
      <button id="themeToggle" onclick="toggleTheme()">🌙 深色模式</button>
    </div>
  </nav>

  <iframe id="toolFrame" name="toolFrame" src="./diffv4.html"></iframe>

  <div id="pageBottom" class="bottom-container">
    <div id="div-onead-nd-01"></div>
    
    <footer id="pageFooter" style="border-top: none; padding: 0.5rem 1rem;">
      <a href="privacy.html">隱私權政策</a> | <a href="mailto:shoulder.winner@gmail.com">聯絡我們</a>

  </div>

  <script>
    function loadTool(url, element) {
      document.getElementById("toolFrame").src = url;
      const links = document.querySelectorAll("#toolMenu a");
      links.forEach(link => link.classList.remove("active"));
      if (element) {
        element.classList.add("active");
      }
    }

    function toggleHeaderAndNav() {
      document.getElementById("pageHeader").classList.toggle("hidden");
      document.getElementById("navBar").classList.toggle("hidden");
      adjustIframeHeight();
    }

    function toggleTheme() {
      const body = document.body;
      const isDark = body.classList.toggle("dark");
      document.getElementById("themeToggle").textContent = isDark ? "☀️ 淺色模式" : "🌙 深色模式";
      localStorage.setItem("theme", isDark ? "dark" : "light");
      try {
        const iframeWin = document.getElementById("toolFrame").contentWindow;
        iframeWin.postMessage({ theme: isDark ? 'dark' : 'light' }, '*');
      } catch (e) {
        console.log("無法向 iframe 發送主題切換通知");
      }
    }

    function adjustIframeHeight() {
      // 只在非手機版（寬度大於 768px）時進行嚴格的高度動態計算
      if (window.innerWidth > 768) {
        const header = document.getElementById("pageHeader");
        const nav = document.getElementById("navBar");
        const bottom = document.getElementById("pageBottom");
        const frame = document.getElementById("toolFrame");
        
        const headerHeight = header && !header.classList.contains("hidden") ? header.offsetHeight : 0;
        const navHeight = nav && !nav.classList.contains("hidden") ? nav.offsetHeight : 0;
        const bottomHeight = bottom ? bottom.offsetHeight : 0;
        
        const remainingHeight = window.innerHeight - headerHeight - navHeight - bottomHeight;
        frame.style.height = `${remainingHeight}px`;
        frame.style.flex = "none"; // 覆蓋 Flex，採用計算出來的高度
      } else {
        // 手機版時，高度改由 CSS 中的 75vh 和媒體查詢控制，此處移除行內高度樣式
        const frame = document.getElementById("toolFrame");
        frame.style.height = ""; 
      }
    }

    // 當廣告非同步載入、底部容器高度變化時，自動調適（僅限電腦版）
    const bottomContainer = document.getElementById("pageBottom");
    if (bottomContainer) {
      const resizeObserver = new ResizeObserver(() => {
        adjustIframeHeight();
      });
      resizeObserver.observe(bottomContainer);
    }

    window.addEventListener("resize", adjustIframeHeight);
    window.addEventListener("load", () => {
      adjustIframeHeight();
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        document.getElementById("themeToggle").textContent = "☀️ 淺色模式";
      }
    });
  </script>
