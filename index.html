<html lang="zh-Hant">

  <meta name="description" content="集合多款實用辦公小工具，如文字比對、跨PDF搜尋、QR Code 產生器等，提升工作效率。">
  <meta name="keywords" content="辦公工具, PDF搜尋, QR Code, 密碼產生器, 倒數計時器">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --primary-color: #007BFF;
      --nav-bg: #f1f1f1;
      --hover-bg: #ddd;
      --active-bg: #007BFF;
      --active-text: #ffffff;
      --border-color: #ccc;
    }

    body.dark {
      --bg-color: #1e1e1e;
      --text-color: #f1f1f1;
      --primary-color: #3399ff;
      --nav-bg: #2c2c2c;
      --hover-bg: #444;
      --active-bg: #3399ff;
      --active-text: #ffffff;
      --border-color: #444;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; /* 防止主頁面出現雙滾動條 */
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav {
      background-color: var(--nav-bg);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
    }

    nav li {
      margin: 0.25rem;
    }

    nav a {
      display: inline-block;
      padding: 0.5rem 1rem;
      text-decoration: none;
      color: var(--text-color);
      border-radius: 4px;
      transition: background 0.3s, color 0.3s;
    }

    nav a:hover {
      background-color: var(--hover-bg);
    }

    /* 當前選中工具的樣式 */
    nav a.active {
      background-color: var(--active-bg);
      color: var(--active-text);
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-buttons button {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .nav-buttons button:hover {
      background-color: var(--hover-bg);
    }

    #themeToggle {
      font-size: 1rem;
    }

    #toolFrame {
      width: 100%;
      border: none;
      display: block;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 2rem 1rem;
      /* 預設隱私與介紹，若iframe載入則此區塊被覆蓋或僅作SEO/備份 */
      display: none; 
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      padding: 1rem;
      border-top: 1px solid var(--border-color);
      background-color: var(--nav-bg);
    }

    #toggleButton {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1001; /* 提升層級避免被 Header 擋住 */
      padding: 0.5rem 0.8rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .hidden {
      display: none !important;
    }
    .bottom-container {
      width: 100%;
      background-color: var(--nav-bg);
      border-top: 1px solid var(--border-color);
      text-align: center;
    }
    
    #div-onead-nd-01 {
      margin: 10px auto;
      max-width: 100%;
    }

    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        align-items: stretch;
      }
      nav ul {
        flex-direction: column;
        width: 100%;
        margin-bottom: 0.5rem;
      }
      nav li {
        width: 100%;
      }
      nav a {
        display: block;
        text-align: center;
      }
      .nav-buttons {
        justify-content: space-between;
      }
    }
    /* 讓廣告與頁尾的容器有固定的樣式，方便 iframe 扣除高度 */
    
  </style>

</head>
<body>

  <script>
    // 載入工具並更新選單 active 狀態
    function loadTool(url, element) {
      document.getElementById("toolFrame").src = url;
      
      // 移除所有選單的 active 樣式
      const links = document.querySelectorAll("#toolMenu a");
      links.forEach(link => link.classList.remove("active"));
      
      // 為當前點擊的選項加上 active 樣式
      if (element) {
        element.classList.add("active");
      }
    }

    // 切換頁首與選單顯示/隱藏
    function toggleHeaderAndNav() {
      document.getElementById("pageHeader").classList.toggle("hidden");
      document.getElementById("navBar").classList.toggle("hidden");
      adjustIframeHeight();
    }

    // 主題切換功能
    function toggleTheme() {
      const body = document.body;
      const isDark = body.classList.toggle("dark");
      document.getElementById("themeToggle").textContent = isDark ? "☀️ 淺色模式" : "🌙 深色模式";
      localStorage.setItem("theme", isDark ? "dark" : "light");
      
      // 建議：如果您的子工具頁面（如 diffv4.html）支援深色模式，
      // 可以透過 postMessage 通知子網頁切換主題。
      try {
        const iframeWin = document.getElementById("toolFrame").contentWindow;
        iframeWin.postMessage({ theme: isDark ? 'dark' : 'light' }, '*');
      } catch (e) {
        console.log("無法向 iframe 發送主題切換通知（可能跨域）");
      }
    }

    // 精準計算 iframe 高度，避免多餘滾動條
    function adjustIframeHeight() {
      const header = document.getElementById("pageHeader");
      const nav = document.getElementById("navBar");
      const bottom = document.getElementById("pageBottom"); // 取得底部容器
      const frame = document.getElementById("toolFrame");
      
      const headerHeight = header && !header.classList.contains("hidden") ? header.offsetHeight : 0;
      const navHeight = nav && !nav.classList.contains("hidden") ? nav.offsetHeight : 0;
      const bottomHeight = bottom ? bottom.offsetHeight : 0; // 取得廣告+Footer的總高度
      
      // 計算剩餘可用高度
      const remainingHeight = window.innerHeight - headerHeight - navHeight - bottomHeight;
      frame.style.height = `${remainingHeight}px`;
    }

    // 監聽視窗調整大小與載入
    window.addEventListener("resize", adjustIframeHeight);
    window.addEventListener("load", () => {
      adjustIframeHeight();
      
      // 初始化深色模式設定
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        document.getElementById("themeToggle").textContent = "☀️ 淺色模式";
      }
    });
  </script>
